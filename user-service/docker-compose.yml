services:
  db:
    image: mysql:8.0
    container_name: shopease-user-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build: .
    container_name: shopease-user-container
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  user_mysql_data:
